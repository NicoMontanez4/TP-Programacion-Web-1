<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PoliLingo - Método de pago</title>
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="../../css/tienda.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/navbar.js" defer></script>
    </head>

    <body>
        <header id="navbar"></header>

        <main>
            <section class="tienda-contenedor">
                <section class="seccion-tienda">
                    <h2>Método de pago</h2>
                    <p class="metodo-pago-subtitulo">Completá el método de pago</p>

                    <form
                        class="formulario-pago"
                        action="compra-realizada.html"
                    >

                        <article class="campo-pago">
                            <label for="nombre">
                                Nombre:
                                <input type="text" id="nombre" name="nombre" required/>
                            </label>
                        </article>

                        <article class="campo-pago">
                            <label for="numero-tarjeta">
                                Número de tarjeta:
                                <input type="number" id="numero-tarjeta" name="numero-tarjeta" required/>
                            </label>
                        </article>

                        <article class="campo-pago">
                            <label for="apellido">
                                Apellido:
                                <input type="text" id="apellido" name="apellido" required/>
                            </label>   
                        </article>

                        <article class="campo-pago">
                            <label for="vencimiento">
                                Vencimiento:
                                <input type="number" id="vencimiento" name="vencimiento" placeholder="MM/AA" required />
                            </label>
                        </article>

                        <article class="campo-pago">
                            <label for="dni">
                                DNI:
                                <input type="number" id="dni" name="dni" required/>
                            </label>
                        </article>

                        <article class="campo-pago">
                            <label for="codigo-seguridad">
                                Código de seguridad:
                                <input type="number" id="codigo-seguridad" name="codigo-seguridad" placeholder="123" required/>
                            </label>
                        </article>

                        <button class="boton-realizar-compra" type="submit">
                            Realizar compra
                        </button>
                    </form>
                </section>
            </section>
        </main>

        <nav class="volver">
            <a class="volver-a-cursos" href="tienda.html">Volver a la tienda</a>
        </nav>

        <footer>
            <p>©2026 PoliLingo - Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
