<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PoliLingo - Tienda</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/tienda.css">
    <script src="../../js/datos.js" defer=""></script>
    <script src="../../js/estado.js" defer=""></script>
    <script src="../../js/utils.js" defer=""></script>
    <script src="../../js/navbar.js" defer=""></script>
    <script src="../../js/paginas/tienda.js" defer=""></script>
</head>
<body>
    <header id="navbar"></header>

    <main>
        <section class="tienda-contenedor">
            
            <header class="tienda-header">
                <h1>Tienda</h1>
            </header>

            <section class="tienda-introduccion">
                <section class="tienda-titulo">
                    <p>¡Canjeá tus gemas!</p>
                    <p>
                        Conseguí recompensas y personalizá tu experiencia en
                        PoliLingo.
                    </p>
                </section>

                <img
                    class="imagen-tienda-titulo"
                    src="../../imagenes/poli/PoliTienda.png"
                    alt="Imagen de poli en la tienda"
                />
            </section>

            <article class="ofertas-tienda">
                <article class="contenedor-oferta-del-dia">
                    <img class="imagen-oferta" src="../../imagenes/tienda/ProtectorDeRacha.png" alt="Imagen de la oferta del dia">

                        <section class="oferta-del-dia">
                            <h2>Oferta del día</h2>
                            <h3>Protector de racha</h3>

                            <span class="valor-item">
                                <button type="button" class="boton-item" data-producto="protector-racha">250
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#FF63DA" viewBox="0 0 24 24">
                                        <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                        <path d="M21.44 11H17.7l-3.12 8.44 6.77-8.27c.04-.05.06-.11.1-.17ZM10.72 2 8.39 9h7.22l-2.33-7zm10.81 6.91-3.37-5.9A2 2 0 0 0 16.42 2h-1.03l2.33 7h3.84s-.02-.06-.04-.09ZM8.39 11l3.4 10.2L15.56 11zM5.84 3.01l-3.37 5.9s-.02.06-.04.09h3.84L8.6 2H7.57c-.72 0-1.38.39-1.74 1.01Zm3.02 15.73L6.28 11H2.56c.04.05.06.11.1.17l6.2 7.58Z"></path>
                                    </svg>
                                </button>
                            </span>
                        </section>
                    </article>

                    <article class="contenedor-oferta-super">
                        <img class="imagen-oferta" src="../../imagenes/poli/SuperPoli.png" alt="Imagen de la oferta del dia">

                        <section class="oferta-super">
                            <h2>Súper</h2>
                            <p>
                                Suscribite a SuperPoli y disfruta de los
                                beneficios.
                            </p>

                            <a class="boton-item" href="superpoli.html">Conocer más</a>
                        </section>
                </article>
            </article>

            <!-- Filtro + productos: los arma tienda.js desde PRODUCTOS (datos.js) -->
            <section class="filtro-tienda">
                <label for="filtro-categoria">Mostrar:</label>
                <select id="filtro-categoria"></select>
            </section>

            <p id="mensaje-tienda" class="mensaje-form" role="status" hidden=""></p>

            <section id="productos-tienda"></section>
        </section>
    </main>

    <nav class="volver">
        <a class="volver-a-cursos" href="../cursos/mis-cursos.html">
            Volver a cursos</a>
    </nav>

    <footer id="footer"></footer>
</body>
</html>
