<!doctype html>

<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PoliLingo - Ranking</title>
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="../../css/ranking.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/navbar.js" defer></script>
        <script src="../../js/paginas/ranking.js" defer></script>
    </head>

    <body>
        <header id="navbar"></header>

        <main>
            <section class="ranking">
                <header class="titulo-ranking">
                    <h1>Ranking</h1>
                    <p>¡Competí y subí de liga!</p>

                    <p>
                        Sumá XP, avanzá posiciones y alcanzá los primeros
                        puestos de la clasificación.
                    </p>
                </header>

                <article class="liga-actual">
                    <h2 id="mensaje-liga"></h2>
                    <p id="indicacion-liga" role="status"></p>
                </article>

                <form class="selector-liga" onsubmit="return false">
                    <label for="selector-liga">Elegí una liga:</label>
                    <select id="selector-liga" name="liga"></select>
                </form>

                <article id="banner-liga">
                    <header class="titulo-liga">
                        <h2 id="titulo-liga"></h2>
                        <p id="texto-liga"></p>
                    </header>

                    <img
                        class="Poli-ranking"
                        src="../../imagenes/poli/PoliRanking.png"
                        alt="poli ranking"
                    />
                </article>

                <p id="mensaje-vacio" class="mensaje-vacio" hidden>
                    Todavía no hay participantes en esta liga.
                </p>

                <section class="tabla-ranking" id="tabla-ranking">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Avatar</th>
                                <th scope="col">Puesto</th>
                                <th scope="col">Estudiante</th>
                                <th scope="col">XP Semanal</th>
                                <th scope="col">Estado</th>
                            </tr>
                        </thead>

                        <tbody id="cuerpo-ranking"></tbody>
                    </table>
                </section>

                <nav class="volver">
                    <a class="volver-a-cursos" href="../cursos/mis-cursos.html">
                        Volver a cursos</a
                    >
                </nav>
            </section>
        </main>

        <footer id="footer"></footer>
    </body>
</html>
