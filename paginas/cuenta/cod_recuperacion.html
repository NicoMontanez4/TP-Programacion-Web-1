<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Código de recuperación</title>
        <link rel="stylesheet" href="../../css/cuenta.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/paginas/cod_recuperacion.js" defer></script>
    </head>

    <body>
        <main>
            <section class="form-login">
                <!-- Logo -->
                <article class="logo">
                    <img
                        src="../../imagenes/poli/Logo.png"
                        alt="Imagen del lorito"
                    />
                    <h2 class="subtitulo-logo">
                        Ingresá el código de 4 dígitos que enviamos a tu email
                    </h2>
                </article>

                <!-- Formulario -->
                <form id="form-codigo" class="campo" method="POST" novalidate>
                    <h3 class="paso-titulo">Código de Seguridad</h3>
                    <hr class="divisor" />

                    <!-- Los 4 inputs del código -->
                    <div class="codigo-digitos">
                        <input
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            pattern="[0-9]"
                            id="numero1"
                            name="numero1"
                            required
                        />
                        <input
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            pattern="[0-9]"
                            id="numero2"
                            name="numero2"
                            required
                        />
                        <input
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            pattern="[0-9]"
                            id="numero3"
                            name="numero3"
                            required
                        />
                        <input
                            type="text"
                            inputmode="numeric"
                            maxlength="1"
                            pattern="[0-9]"
                            id="numero4"
                            name="numero4"
                            required
                        />
                    </div>

                    <p
                        id="mensaje-codigo"
                        class="mensaje-form"
                        role="alert"
                        hidden
                    ></p>

                    <!-- Botones -->
                    <button type="submit" class="boton boton-verde">
                        Enviar
                    </button>
                    <a href="login.html" class="boton boton-azul"> Cancelar </a>
                </form>
            </section>
        </main>
    </body>
</html>
