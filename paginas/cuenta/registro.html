<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoliLingo - Registrarse</title>
    <link rel="stylesheet" href="../../css/cuenta.css" />
    <script src="../../js/datos.js" defer></script>
    <script src="../../js/estado.js" defer></script>
    <script src="../../js/paginas/registro.js" defer></script>
  </head>

  <body>
    <main>
      <!-- Formulario de Registro -->
      <section class="form-login">
        <article class="logo">
          <img src="../../imagenes/poli/Logo.png" alt="Imagen del lorito" />
          <h2>Registrate y comenzá a aprender el idioma que más te guste.</h2>
        </article>

        <form class="campo" id="form-registro" novalidate>
          <label for="nombre">Nombre:</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            placeholder="Juan"
            required
          />

          <label for="apellido">Apellido (opcional):</label>
          <input
            id="apellido"
            name="apellido"
            type="text"
            placeholder="Perez"
          />

          <label for="usuario">Nombre de usuario:</label>
          <input
            id="usuario"
            name="usuario"
            type="text"
            placeholder="juanperez_web"
            required
          />

          <div id="req-usuario" class="mensaje-form mensaje-error">
            De 3 a 15 caracteres: letras, números y _
          </div>

          <label for="email">Email:</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="ejemplo@email.com"
            required
          />

          <label for="contrasenia">Contraseña:</label>
          <input
            id="contrasenia"
            name="contrasenia"
            type="password"
            placeholder="Mínimo 8 caracteres"
            required
          />

          <!-- Requerimientos de contraseña en filas independientes (rojos por default con ✕) -->
          <div id="req-longitud" class="mensaje-form mensaje-error">
            Mínimo 8 caracteres
          </div>
          <div id="req-numero" class="mensaje-form mensaje-error">
            Al menos un número
          </div>

          <label for="repetir-contrasenia">Repeti la Contraseña:</label>
          <input
            id="repetir-contrasenia"
            name="repetir-contrasenia"
            type="password"
            placeholder="********"
            required
          />

          <label class="campo-checkbox">
            <input type="checkbox" id="terminos" name="terminos" />
            Acepto los Términos y la Política de Privacidad
          </label>

          <p id="mensaje-registro" class="mensaje-form" role="alert" hidden></p>

          <button type="submit" class="boton-login">
            <span class="negrita">Registrarse</span>
          </button>
          <a href="../../index.html" class="boton-login">Ya tengo una cuenta</a>
        </form>
      </section>
    </main>
  </body>
</html>
