<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Recuperar Contraseña</title>
        <link rel="stylesheet" href="../../css/cuenta.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/paginas/olvidaste_contra.js" defer></script>
    </head>

    <body>
        <main>
            <section class="form-login">
                <!-- Header -->
                <article class="logo">
                    <img
                        src="../../imagenes/poli/Logo.png"
                        alt="Imagen del lorito"
                    />
                    <h2 class="subtitulo-logo">
                        No te preocupes, don't worry, mach dir keine Sorgen,
                        别担心...
                    </h3>
                </article>

                <!-- Formulario -->
                <form method="POST" class="campo" novalidate>
                    <h3 class="paso-titulo">Recuperar Cuenta</h3>
                    <hr class="divisor" />

                    <label for="email">Email:</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="ejemplo@email.com"
                        required
                    />

                    <p class="texto-ayuda-extra">
                        Ingresá el mail para recibir el código de recuperación.
                    </p>

                    <p
                        id="mensaje-recuperar"
                        class="mensaje-form"
                        role="alert"
                        hidden
                    ></p>

                    <!-- Botones -->
                    <button type="submit" class="boton boton-verde">
                        Aceptar
                    </button>
                    <a href="../../index.html" class="boton boton-azul">
                        Cancelar
                    </a>
                </form>
            </section>
        </main>
    </body>
</html>
