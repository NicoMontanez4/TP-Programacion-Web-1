<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nueva Contraseña</title>
        <link rel="stylesheet" href="../../css/cuenta.css" />
        <link rel="stylesheet" href="../../css/ver-contrasenia.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/ver-contrasenia.js" defer></script>
        <script src="../../js/paginas/nueva_contrasenia.js" defer></script>
    </head>

    <body>
        <main>
            <section class="form-login">
                <!-- Logo y Textos -->
                <article class="logo">
                    <img
                        src="../../imagenes/poli/Logo.png"
                        alt="Imagen del lorito"
                    />
                    <h2>Código Verificado</h2>
                    <h3 class="subtitulo-logo">Elegí tu nueva contraseña</h3>
                </article>

                <!-- Formulario -->
                <form
                    method="POST"
                    class="campo"
                    id="form-nueva-contra"
                    novalidate
                >
                    <h3 class="paso-titulo">Nueva Contraseña</h3>
                    <hr class="divisor" />

                    <label for="nueva-contrasenia">Nueva contraseña:</label>
                    <input
                        id="nueva-contrasenia"
                        name="nueva-contrasenia"
                        type="password"
                        required
                    />
                    <!-- Requisitos de la contraseña -->
                    <article id="req-longitud" class="ayuda-campo">
                        Mínimo 8 caracteres
                    </article>
                    <article id="req-numero" class="ayuda-campo">
                        Al menos un número
                    </article>

                    <label for="confirmar-nueva-contrasenia"
                        >Confirmar contraseña:</label
                    >
                    <input
                        id="confirmar-nueva-contrasenia"
                        name="confirmar-nueva-contrasenia"
                        type="password"
                        placeholder="********"
                        required
                    />

                    <p
                        id="mensaje-nueva-contra"
                        class="mensaje-form"
                        role="alert"
                        hidden
                    ></p>

                    <!-- Botones -->
                    <button type="submit" class="boton boton-verde">
                        Guardar y volver a Iniciar Sesión
                    </button>
                    <a href="login.html" class="boton boton-azul"> Cancelar </a>
                </form>
            </section>
        </main>
    </body>
</html>
