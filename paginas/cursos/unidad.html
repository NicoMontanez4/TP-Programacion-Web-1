<!doctype html>

<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PoliLingo - Unidad</title>
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="../../css/mapa.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/navbar.js" defer></script>
        <script src="../../js/paginas/unidad.js" defer></script>
    </head>

    <body>
        <header id="navbar"></header>

        <main>
            <!-- Encabezado: bandera + idioma + título y descripción de la unidad (los completa unidad.js) -->
            <section class="encabezado-curso">
                <section class="info-curso">
                    <section class="titulo-curso">
                        <img id="bandera-curso" class="imagen-bandera" src="" alt="" />
                        <h1 id="nombre-curso"></h1>
                    </section>
                </section>

                <article class="titulo-unidad">
                    <h2 id="titulo-unidad"></h2>
                    <p id="descripcion-unidad" class="texto-unidad"></p>
                </article>
            </section>

            <section class="unidad">
                <section class="tarjeta-unidad">
                    <!-- Poli + volver al curso -->
                    <section class="recorrdio-imagen">
                        <h2 id="mensaje-unidad"></h2>
                        <img id="imagen-unidad" class="imagen-unidad" src="" alt="" />
                        <a id="volver-al-curso" class="volver-a-cursos" href="mis-cursos.html">Volver al curso</a>
                    </section>

                    <!-- Recorrido de lecciones: lo arma unidad.js según el progreso del usuario -->
                    <article id="recorrido" class="recorrido-lecciones-unidad"></article>
                </section>
            </section>
        </main>

        <footer id="footer"></footer>
    </body>
</html>
