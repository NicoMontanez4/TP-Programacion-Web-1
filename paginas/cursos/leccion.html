<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lección interactiva - PoliLingo</title>
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="../../css/leccion.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/navbar.js" defer></script>
        <script src="../../js/paginas/leccion.js" defer></script>
    </head>

    <body>
        <header id="navbar"></header>

        <main class="ejercicio">
            <section class="leccion-container">
                <!-- CABECERA DE LA SECCIÓN (Header correcto) -->
                <header class="barra-leccion">
                    <a
                        id="boton-salir"
                        class="boton-salir"
                        href="mapa.html"
                        aria-label="Salir de la lección"
                        >✕</a
                    >

                    <img
                        id="bandera-leccion"
                        class="bandera-leccion"
                        src=""
                        alt=""
                    />

                    <!-- hgroup agrupa correctamente Título + Subtítulo -->
                    <hgroup class="titulo-leccion">
                        <h1 id="leccion-curso"></h1>
                        <p id="leccion-unidad"></p>
                        <p id="leccion-titulo"></p>
                    </hgroup>

                    <ul class="estado-leccion">
                        <li id="intentos" class="intentos" aria-label="Te quedan 3 de 3 intentos">
                            <span>Intentos</span>
                            <span id="intentos-marcas" class="intentos-marcas" aria-hidden="true"></span>
                            <span id="intentos-numero" class="intentos-numero"></span>
                            <span class="intentos-ayuda">Si usás los 3 intentos, perdés 1 vida ❤️</span>
                        </li>

                        <li>
                            <label id="progreso-texto" for="progreso-leccion">Progreso de la lección: 0%</label>
                            <progress id="progreso-leccion" value="0" max="100">0%</progress>
                        </li>
                    </ul>
                </header>

                <!-- FORMULARIO DE EJERCICIO (No es un article, es una interacción) -->
                <section class="tarjeta-ejercicio">

                    <!-- BLOQUE 1: Pregunta y Construcción de respuesta -->
                    <section class="pregunta">
                        <img
                            class="imagen-poli"
                            src="../../imagenes/poli/Poli-hablando.png"
                            alt="Mascota Poli hablando"
                        />

                        <section class="enunciado">
                            <h2>Traducí la siguiente oración:</h2>
                            <p class="frase">
                                <strong id="frase"></strong>
                            </p>

                            <ol id="respuesta" class="respuesta" aria-label="Tu respuesta"></ol>
                        </section>
                    </section>

                    <!-- BLOQUE 2: Banco de palabras -->
                    <section class="banco-palabras">
                        <h3>Banco de palabras disponibles:</h3>

                        <ul id="banco" class="banco" aria-label="Palabras para elegir"></ul>
                    </section>
                </section>
            </section>

            <!-- Panel de éxito -->
            <section id="correcto" class="resultado exito" role="status">
                <h2>¡Correcto!</h2>
                <p id="mensaje-correcto"></p>
                <button type="button" id="boton-continuar" class="boton-comprobar">Continuar</button>
            </section>

            <!-- Panel de error -->
            <section id="incorrecto" class="resultado error" role="alert">
                <h2>Incorrecto</h2>
                <p>Revisá el orden de las palabras e intentá de nuevo.</p>
                <button type="button" id="boton-reintentar" class="boton-comprobar">Reintentar</button>
            </section>

            <button type="button" class="boton-comprobar" id="boton-comprobar">Comprobar respuesta</button>
        </main>
        <footer id="footer"></footer>
    </body>
</html>
