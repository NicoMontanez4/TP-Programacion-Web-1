<!doctype html>

<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PoliLingo - Curso</title>
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="../../css/mapa.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/navbar.js" defer></script>
        <script src="../../js/paginas/mapa.js" defer></script>
    </head>

    <body>
        <header id="navbar"></header>

        <main>
            <!-- Encabezado del curso: lo completa mapa.js -->
            <section class="encabezado-curso">
                <section class="info-curso">
                    <section class="titulo-curso">
                        <img id="bandera-curso" class="imagen-bandera" src="" alt="" />
                        <h1 id="nombre-curso"></h1>
                    </section>

                    <p id="mensaje-curso" class="mensaje"></p>

                    <section class="progreso-curso">
                        <label id="texto-progreso" for="progreso-curso"></label>
                        <progress id="progreso-curso" value="0" max="100"></progress>
                    </section>
                </section>

                <img id="imagen-curso" class="imagen-unidad-Poli" src="" alt="" />
            </section>

            <!-- Mapa de unidades: lo arma mapa.js según el progreso del usuario -->
            <section class="contenedor-mapa-unidades">
                <h2>Seleccioná la unidad que quieras repasar o continuar.</h2>
                <article id="mapa-unidades" class="mapa-unidades-ingles"></article>
            </section>

            <nav class="volver">
                <a class="volver-a-cursos" href="mis-cursos.html">Volver a mis cursos</a>
            </nav>
        </main>

        <footer id="footer"></footer>
    </body>
</html>
