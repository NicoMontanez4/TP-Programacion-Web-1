<!doctype html>

<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mapa de Unidades - Ingles</title>
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="../../css/mapa.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/navbar.js" defer></script>
    </head>

    <body>
        <header id="navbar"></header>

        <main>
            <!-- Seccion introductoria - Bandera + Titulo idioma + texto 
             + barra de progreso del lado izquierdo + foto del derecho-->

            <section class="encabezado-curso">
                <section class="info-curso">
                    <section class="titulo-curso">
                        <img
                            class="imagen-bandera"
                            src="../../imagenes/banderas/BanderaReinoUnido.png"
                            alt="Bandera Reino Unido"
                        />

                        <h1>Inglés</h1>
                    </section>

                    <p class="mensaje">
                        ¡Vas muy bien!<br />
                        Próxima lección:
                        <strong>Transporte</strong>.
                    </p>

                    <section class="progreso-curso">
                        <label for="progreso-ingles"
                            >Progreso: 40% · Nivel Intermedio (B1)</label
                        >
                        <progress value="40" max="100">40%</progress>
                    </section>
                </section>

                <img
                    class="imagen-unidad-Poli"
                    src="../../imagenes/cursos/CursoIngles.png"
                    alt="Poli curso ingles"
                />
            </section>

            <!-- Seccion del mapa de unidades-->

            <!-- Seccion unidad completa-->

            <section class="contenedor-mapa-unidades">
                <h2>Selecciona la unidad que quieras repasar o continuar.</h2>

                <article class="mapa-unidades-ingles">
                    <!-- Unidad 1 - completada -->
                    <article class="fila-unidad">
                        <span class="icono-estado estado-completada">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                fill="#ffffff"
                                viewBox="0 0 24 24"
                            >
                                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                <path
                                    d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10 10-4.49 10-10S17.51 2 12 2m-1.29 13.71c-.2.2-.45.29-.71.29s-.51-.1-.71-.29l-3-3L7.7 11.3l2.29 2.29 5.29-5.29 1.41 1.41-6 6Z"
                                ></path>
                            </svg>
                        </span>

                        <article class="tarjeta-unidad">
                            <article class="info-unidad">
                                <img
                                    src="../../imagenes/unidades/Unidad-Saludos.png"
                                    alt="Imagen de unidad Saludos"
                                />

                                <section class="datos-unidad">
                                    <h3>Unidad 1 Saludos</h3>
                                    <a
                                        class="boton-repasar boton-verde"
                                        href="unidad.html?curso=ingles&unidad=1"
                                        >Repasar</a
                                    >
                                </section>
                            </article>

                            <section class="progreso-curso estado-unidad">
                                <label for="progreso-u1"
                                    >Completada · 4/4 lecciones</label
                                >
                                <progress
                                    id="progreso-u1"
                                    class="barra-completada"
                                    value="100"
                                    max="100"
                                >
                                    100%
                                </progress>
                            </section>
                        </article>
                    </article>

                    <!-- Unidad 2 - completada -->
                    <article class="fila-unidad">
                        <span class="icono-estado estado-completada">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                fill="#ffffff"
                                viewBox="0 0 24 24"
                            >
                                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                <path
                                    d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10 10-4.49 10-10S17.51 2 12 2m-1.29 13.71c-.2.2-.45.29-.71.29s-.51-.1-.71-.29l-3-3L7.7 11.3l2.29 2.29 5.29-5.29 1.41 1.41-6 6Z"
                                ></path>
                            </svg>
                        </span>

                        <article class="tarjeta-unidad">
                            <article class="info-unidad">
                                <img
                                    src="../../imagenes/unidades/Unidad-Comida.png"
                                    alt="Imagen de unidad Comidas"
                                />

                                <section class="datos-unidad">
                                    <h3>Unidad 2 Comidas</h3>
                                    <a
                                        class="boton-repasar boton-verde"
                                        href="unidad.html?curso=ingles&unidad=2"
                                        >Repasar</a
                                    >
                                </section>
                            </article>

                            <section class="progreso-curso estado-unidad">
                                <label for="progreso-u2"
                                    >Completada · 4/4 lecciones</label
                                >
                                <progress
                                    id="progreso-u2"
                                    class="barra-completada"
                                    value="100"
                                    max="100"
                                >
                                    100%
                                </progress>
                            </section>
                        </article>
                    </article>

                    <!-- Unidad 3 - en curso -->
                    <article class="fila-unidad">
                        <span class="icono-estado estado-en-curso">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                fill="#ffffff"
                                viewBox="0 0 24 24"
                            >
                                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                <path
                                    d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10 10-4.49 10-10S17.51 2 12 2m4.7 13.87-5.2-3c-.31-.18-.5-.51-.5-.87V6h2v5.42l4.7 2.71-1 1.73Z"
                                ></path>
                            </svg>
                        </span>

                        <article class="tarjeta-unidad tarjeta-en-curso">
                            <article class="info-unidad">
                                <img
                                    src="../../imagenes/unidades/Unidad-Viajes.png"
                                    alt="Imagen de unidad Viajes"
                                />

                                <section class="datos-unidad">
                                    <h3>Unidad 3 Viajes</h3>
                                    <a
                                        class="boton-repasar boton-naranja"
                                        href="unidad.html?curso=ingles&unidad=3"
                                        >Comenzar</a
                                    >
                                </section>
                            </article>

                            <section class="progreso-curso estado-unidad">
                                <label for="progreso-u3"
                                    >En curso · 0/4 lecciones</label
                                >
                                <progress
                                    id="progreso-u3"
                                    class="barra-en-curso"
                                    value="0"
                                    max="100"
                                >
                                    0%
                                </progress>
                            </section>
                        </article>
                    </article>

                    <!-- Unidad 4 - bloqueada -->
                    <article class="fila-unidad">
                        <span class="icono-estado estado-bloqueada">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="22"
                                height="22"
                                fill="#ffffff"
                                viewBox="0 2 24 24"
                            >
                                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                <path
                                    d="M6 22h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v2H6c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2m7-4.28V20h-2v-2.28A2 2 0 0 1 10 16c0-1.1.9-2 2-2s2 .9 2 2a2 2 0 0 1-1 1.72M9 7c0-1.65 1.35-3 3-3s3 1.35 3 3v2H9z"
                                ></path>
                            </svg>
                        </span>

                        <article class="tarjeta-unidad tarjeta-bloqueada">
                            <article class="info-unidad">
                                <img
                                    src="../../imagenes/unidades/Unidad-Conversacion.png"
                                    alt="Imagen de unidad Conversaciones"
                                />

                                <section class="datos-unidad">
                                    <h3>Unidad 4 Conversaciones</h3>
                                </section>
                            </article>

                            <section class="progreso-curso estado-unidad">
                                <label>Bloqueada · 0/4 lecciones</label>
                            </section>
                        </article>
                    </article>

                    <!-- Unidad 5 - bloqueada -->
                    <article class="fila-unidad">
                        <span class="icono-estado estado-bloqueada">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="22"
                                height="22"
                                fill="#ffffff"
                                viewBox="0 2 24 24"
                            >
                                <!--Boxicons v3.0.8 https://boxicons.com | License  https://docs.boxicons.com/free-->
                                <path
                                    d="M6 22h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v2H6c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2m7-4.28V20h-2v-2.28A2 2 0 0 1 10 16c0-1.1.9-2 2-2s2 .9 2 2a2 2 0 0 1-1 1.72M9 7c0-1.65 1.35-3 3-3s3 1.35 3 3v2H9z"
                                ></path>
                            </svg>
                        </span>

                        <article class="tarjeta-unidad tarjeta-bloqueada">
                            <article class="info-unidad">
                                <img
                                    src="../../imagenes/unidades/Unidad-TiemposVerbales.png"
                                    alt="Imagen de unidad Tiempos verbales"
                                />

                                <section class="datos-unidad">
                                    <h3>Unidad 5 Tiempos verbales</h3>
                                </section>
                            </article>

                            <section class="progreso-curso estado-unidad">
                                <label>Bloqueada · 0/4 lecciones</label>
                            </section>
                        </article>
                    </article>
                </article>
            </section>

            <nav class="volver">
                <a class="volver-a-cursos" href="mis-cursos.html">
                    Volver a cursos</a
                >
            </nav>

            <br />
        </main>

        <footer id="footer"></footer>
    </body>
</html>
