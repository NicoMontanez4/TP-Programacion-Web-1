<!doctype html>

<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PoliLingo - Curso</title>
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="../../css/mapa.css" />
        <script src="../../js/datos.js" defer></script>
        <script src="../../js/estado.js" defer></script>
        <script src="../../js/utils.js" defer></script>
        <script src="../../js/navbar.js" defer></script>
        <script src="../../js/paginas/mapa.js" defer></script>
    </head>

    <body>
        <header id="navbar"></header>

        <main>
            <!-- Encabezado del curso: lo completa mapa.js -->
            <section class="encabezado-curso">
                <section class="info-curso">
                    <section class="titulo-curso">
                        <img id="bandera-curso" class="imagen-bandera" src="" alt="" />
                        <h1 id="nombre-curso"></h1>
                    </section>

                    <p id="mensaje-curso" class="mensaje"></p>

                    <section class="progreso-curso">
                        <label id="texto-progreso" for="progreso-curso"></label>
                        <progress id="progreso-curso" value="0" max="100"></progress>
                    </section>
                </section>

                <img id="imagen-curso" class="imagen-unidad-Poli" src="" alt="" />
            </section>

            <!-- Mapa de unidades: lo arma mapa.js según el progreso del usuario -->
            <section class="contenedor-mapa-unidades">
                <h2>Seleccioná la unidad que quieras repasar o continuar.</h2>
                <article id="mapa-unidades" class="mapa-unidades-ingles"></article>
            </section>

            <!-- Valoraciones del curso: las completa mapa.js -->
            <section class="valoraciones" aria-labelledby="titulo-valoraciones">
                <header class="valoraciones-encabezado">
                    <h2 id="titulo-valoraciones">Opiniones del curso</h2>
                    <p id="promedio-curso" class="promedio-curso"></p>
                </header>

                <ul id="lista-comentarios" class="lista-comentarios"></ul>

                <form id="form-comentario" class="form-comentario" novalidate>
                    <h3>Dejá tu opinión</h3>

                    <fieldset class="elegir-estrellas">
                        <legend>¿Cuántas estrellas le das?</legend>
                        <!-- Van de 5 a 1: el CSS las da vuelta para que se vean de 1 a 5 -->
                        <input type="radio" id="estrella-5" name="estrellas" value="5" />
                        <label for="estrella-5" title="5 estrellas">★</label>
                        <input type="radio" id="estrella-4" name="estrellas" value="4" />
                        <label for="estrella-4" title="4 estrellas">★</label>
                        <input type="radio" id="estrella-3" name="estrellas" value="3" />
                        <label for="estrella-3" title="3 estrellas">★</label>
                        <input type="radio" id="estrella-2" name="estrellas" value="2" />
                        <label for="estrella-2" title="2 estrellas">★</label>
                        <input type="radio" id="estrella-1" name="estrellas" value="1" />
                        <label for="estrella-1" title="1 estrella">★</label>
                    </fieldset>

                    <label for="texto-comentario">Tu comentario:</label>
                    <textarea
                        id="texto-comentario"
                        rows="3"
                        maxlength="300"
                        placeholder="¿Qué te pareció el curso?"
                    ></textarea>

                    <p id="mensaje-comentario" class="mensaje-form" role="alert" hidden></p>

                    <button type="submit" class="boton-publicar">Publicar opinión</button>
                </form>

                <p id="ya-opinaste" class="ya-opinaste" hidden>¡Gracias! Ya dejaste tu opinión sobre este curso.</p>
            </section>

            <nav class="volver">
                <a class="volver-a-cursos" href="mis-cursos.html">Volver a mis cursos</a>
            </nav>
        </main>

        <footer id="footer"></footer>
    </body>
</html>
