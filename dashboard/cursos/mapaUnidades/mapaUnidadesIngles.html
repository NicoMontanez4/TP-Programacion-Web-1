<!doctype html>

<html lang="es">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mapa de Unidades</title>
        <link rel="stylesheet" href="mapaUnidades.css" />

    </head>


    
    <body>

        <header>

           

        </header>


        <main>

            
            <section class="encabezado-curso"> 

                <section class="info-curso">

                    <section class="titulo-curso">

                        <img src="imagenes/BanderaReinoUnido.png" alt="Bandera Reino Unido" />
                        <h1> Inglés </h1>

                    </section>

                    <p class="mensaje">

                        ¡Vas muy bien!<br>
                        Tu próxima lección es <strong>Alimentos y bebidas</strong>.

                    </p>


                    <section class="progreso-curso">

                        <label for="progreso-ingles">Progreso: 45% · Nivel Intermedio (B1)</label>
                        <progress id="progreso-ingles" value="45" max="100">45%</progress>
                     
                    </section>

                     
                </section>

                <img src="imagenes/CursoIngles.png" alt="Poli curso ingles" />

            </section>

        <!-- Seccion del mapa de unidades-->

        <!-- Seccion unidad completa-->

            <article class="unidad-completada">

                <img class="icono-unidad" src="imagenes/IconoSaludos.png" alt="Unidad Saludos" />

                <section class="info-unidad">

                    <h2>Unidad 1 - Saludos</h2>
                    <p><i>Aprende a presentarte, saludar y mantener conversaciones básicas.</i></p>
                
                </section>

                <section class="progreso-unidad">

                    <label for="progreso-u1">Completada · 3 / 3 lecciones</label>
                    <progress id="progreso-u1" value="3" max="3">3 de 3</progress>
                
                </section>
                
            </article>

        <!-- Seccion unidad en curso-->

        <article class="unidad-en-progreso">

                <img class="icono-unidad" src="imagenes/IconoComida.png" alt="Unidad Comida" />

                <section class="info-unidad">

                    <h2>Unidad 2 - Comida</h2>
                    <p><i>Habla sobre tus comidas favoritas, restaurantes y hábitos alimenticios.</i></p>
                
                </section>

                <section class="progreso-unidad">

                    <label for="progreso-u1">Progreso · 1 / 3 lecciones</label>
                    <progress id="progreso-u1" value="1" max="3">3 de 3</progress>
                
                </section>
                
        </article>



        </main>


    </body>
