<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Registrarse</title>
        <link rel="stylesheet" href="../login-register.css" />
    </head>

    <body>
        <main>
            <form
                class="form-login"
                action="../dashboard/Dashboard.html"
                method="POST"
            >
                <fieldset class="logo">
                    <h2>
                        Registrate y comenzá a aprender el idioma que más te
                        guste.
                    </h2>
                </fieldset>

                <fieldset class="campo">
                    <label for="usuario">Usuario / Email:</label>
                    <input
                        id="usuario"
                        name="username"
                        type="text"
                        placeholder="ejemplo@email.com"
                        required
                    />
                </fieldset>

                <fieldset class="campo">
                    <label for="contrasenia">Contraseña:</label>
                    <input
                        id="contrasenia"
                        name="contrasenia"
                        type="password"
                        placeholder="Mínimo 8 caracteres"
                        required
                    />
                </fieldset>

                <fieldset class="campo">
                    <label for="confirmar-contrasenia"
                        >Repetí la Contraseña:</label
                    >
                    <input
                        type="password"
                        id="confirmar-contrasenia"
                        name="confirmar-contrasenia"
                        required
                    />
                </fieldset>

                <fieldset class="campo campo-checkbox">
                    <input
                        type="checkbox"
                        id="recordarme"
                        name="recordarme"
                        required
                    />
                    <label for="recordarme"
                        >Acepto los Términos y la Política de Privacidad</label
                    >
                </fieldset>

                <!-- Se usa submit para procesar y validar todos los campos required -->
                <button type="submit" class="boton-login">Registrarse</button>
                <a class="boton-login" href="../index.html">Tengo una cuenta</a>
            </form>
        </main>
    </body>
</html>
