<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoliLingo - Registrarse</title>
    <link rel="stylesheet" href="../login-register.css" />
  </head>

  <body>
    <main>
      <!-- Texto del Inicio -->
      <section class="form-login">
        <article class="logo">
          <h2>Registrate y comenza a aprender el idioma que mas te guste.</h2>
        </article>

        <!-- Formulario -->
        <article class="form-login">
          <form action="../dashboard/Dashboard.html" method="GET" class="campo">
            <label for="email">Email:</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="ejemplo@email.com"
              required
            />

            <label for="contrasenia">Contraseña:</label>
            <input
              id="contrasenia"
              name="contrasenia"
              type="password"
              placeholder="Mínimo 8 caracteres"
              required
            />

            <label for="contrasenia">Repeti la Contraseña:</label>
            <input
              id="contrasenia"
              name="contrasenia"
              type="password"
              placeholder="********"
              required
            />

            <label class="campo-checkbox">
              <input type="checkbox" id="recordarme" name="recordarme" />
              Acepto los Términos y la Política de Privacidad
            </label>

            <button type="submit" class="boton-login">
              <span class="negrita">Registrarse</span>
            </button>
            <a href="../index.html" class="boton-login">Tengo una cuenta</a>
          </form>
        </article>
      </section>
    </main>
  </body>
</html>
