<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nueva Contraseña</title>
        <link rel="stylesheet" href="..//login-register.css" />
    </head>

    <body>
        <main>
                <form
                    class="form-login"
                    action="/procesar-datos"
                    method="post"
                >
                    <fieldset class="logo">
                        <h2>Código Verificado</h2>
                        <h3>Elegí tu nueva contraseña</h3>
                    </fieldset>

                    <fieldset class="campo">
                        <label for="nueva-contrasenia">Nueva contraseña:</label>
                        <input
                            type="password"
                            id="nueva-contrasenia"
                            name="nueva-contrasenia"
                            required
                        />
                    </fieldset>

                    <fieldset class="campo" for="confirmar-nueva-contrasenia">
                        <label>Confirmar nueva contraseña:</label>
                        <input
                            type="password"
                            id="confirmar-nueva-contrasenia"
                            name="confirmar-nueva-contrasenia"
                            required
                        />
                    </fieldset>

                    <a class="boton-login" href="../index.html"
                        >Guardar y volver a Iniciar Sesión</a
                    >
                    <a class="boton-login" href="../index.html">Cancelar</a>
                </form>
            </section>
        </main>
    </body>
</html>
