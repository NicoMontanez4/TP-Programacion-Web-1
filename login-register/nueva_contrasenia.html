<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoliLingo - Nueva Contraseña</title>
    <link rel="stylesheet" href="../login-register.css" />
  </head>

  <body>
    <main>
      <!-- Texto del Inicio -->
      <section class="form-login">
        <article class="logo">
          <h2>Código Verificado</h2>
          <h3>Elegí tu nueva contraseña</h3>
        </article>

        <!-- Formulario -->
        <article class="form-login">
          <form action="../index.html" method="GET" class="campo">
            <label for="email">Nueva contraseña:</label>
            <input
              id="nueva-contrasenia"
              name="nueva-contrasenia"
              type="password"
              required
            />
            <label for="email">Nueva contraseña:</label>
            <input
              id="confirmar-nueva-contrasenia"
              name="confirmar-nueva-contrasenia"
              type="password"
              required
            />
            <button type="submit" class="boton-login">
              <span class="negrita">Guardar y volver a Iniciar Sesión</span>
            </button>
            <a href="../index.html" class="boton-login">Cancelar</a>
          </form>
        </article>
      </section>
    </main>
  </body>
</html>
