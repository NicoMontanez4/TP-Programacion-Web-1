<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoliLingo - Código de recuperación</title>
    <link rel="stylesheet" href="../login-register.css" />
  </head>

  <body>
    <main>
      <!-- Texto del Inicio -->
      <section class="form-login">
        <article class="logo">
          <h2>Verificá tu identidad</h2>
          <h3>Ingresá el código de 4 dígitos que enviamos a tu email</h3>
        </article>

        <h3><span class="negrita">Código de Recuperacion</span></h3>

        <!-- Formulario -->
        <article class="grupo-inputs-codigo">
          <form action="../login-register/nueva_contrasenia.html" method="GET">
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              id="numero1"
              name="numero1"
              required
            />
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              id="numero2"
              name="numero2"
              required
            />
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              id="numero3"
              name="numero3"
              required
            />
            <input
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              id="numero4"
              name="numero4"
              required
            />
            <button type="submit" class="boton-login">
              <span class="negrita">Enviar</span>
            </button>
            <a href="../index.html" class="boton-login">Cancelar</a>
          </form>
        </article>
      </section>
    </main>
  </body>
</html>
