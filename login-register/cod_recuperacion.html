<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Código de recuperación</title>
        <link rel="stylesheet" href="../login-register.css" />
    </head>

    <body>
        <main>
            <form
                class="form-login"
                action="nueva_contrasenia.html"
                method="POST"
            >
                <fieldset class="logo">
                    <h2>Verificá tu identidad</h2>
                    <h3>
                        Ingresá el código de 4 dígitos que enviamos a tu email
                    </h3>
                </fieldset>

                <h3>Código de recuperación:</h3>

                <fieldset class="grupo-inputs-codigo">
                    <input
                        type="text"
                        inputmode="numeric"
                        maxlength="1"
                        pattern="[0-9]"
                        id="numero1"
                        name="numero1"
                        required
                    />
                    <input
                        type="text"
                        inputmode="numeric"
                        maxlength="1"
                        pattern="[0-9]"
                        id="numero2"
                        name="numero2"
                        required
                    />
                    <input
                        type="text"
                        inputmode="numeric"
                        maxlength="1"
                        pattern="[0-9]"
                        id="numero3"
                        name="numero3"
                        required
                    />
                    <input
                        type="text"
                        inputmode="numeric"
                        maxlength="1"
                        pattern="[0-9]"
                        id="numero4"
                        name="numero4"
                        required
                    />
                </fieldset>

                <!-- Cambiado de <a> a <button type="submit"> para forzar validación -->
                <button type="submit" class="boton-login">Enviar</button>
                <a class="boton-login" href="olvidaste_contra.html">Cancelar</a>
            </form>
        </main>
    </body>
</html>
