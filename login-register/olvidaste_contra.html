<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoliLingo - Recuperar Contraseña</title>
    <link rel="stylesheet" href="../login-register.css" />
  </head>

  <body>
    <main>
      <!-- Texto del Inicio -->
      <section class="form-login">
        <article class="logo">
          <h2>¿Olvidaste tu contraseña?</h2>
          <h3>
            No te preocupes, don't worry, mach dir keine Sorgen, 别担心...
          </h3>
        </article>

        <!-- Formulario -->
        <article class="form-login">
          <form
            action="../login-register/cod_recuperacion.html"
            method="GET"
            class="campo"
          >
            <label for="email">Email:</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="ejemplo@email.com"
              required
            />
            <p>(Ingresa el mail para recibir el código de recuperación)</p>
            <button type="submit" class="boton-login">
              <span class="negrita">Aceptar</span>
            </button>
            <a href="../index.html" class="boton-login">Cancelar</a>
          </form>
        </article>
      </section>
    </main>
  </body>
</html>
