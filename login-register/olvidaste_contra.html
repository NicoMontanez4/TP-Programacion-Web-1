<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Recuperar Contraseña</title>
        <link rel="stylesheet" href="../login-register.css" />
    </head>

    <body>
        <main>
            <!-- El action apunta a la siguiente pantalla tras validar el input -->
            <form
                class="form-login"
                action="cod_recuperacion.html"
                method="POST"
            >
                <fieldset class="logo">
                    <h2>¿Olvidaste tu contraseña?</h2>
                    <h3>
                        No te preocupes, don't worry, mach dir keine Sorgen,
                        别担心...
                    </h3>
                </fieldset>

                <fieldset class="campo">
                    <label for="email">Email:</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="ejemplo@email.com"
                        required
                    />
                    <p>
                        (Ingresa el mail para recibir el código de recuperación)
                    </p>
                </fieldset>

                <!-- Se usa submit para activar la validación requerida del input -->
                <button type="submit" class="boton-login">Aceptar</button>
                <a class="boton-login" href="../index.html">Cancelar</a>
            </form>
        </main>
    </body>
</html>
