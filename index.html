<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoliLingo - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/cuenta.css" />
    <script src="js/datos.js" defer></script>
    <script src="js/estado.js" defer></script>
    <script src="js/paginas/login.js" defer></script>
  </head>

  <body>
    <main>
      <!-- Logo y Texto del Inicio -->
      <section class="form-login">
        <article class="logo">
          <img src="imagenes/poli/Logo.png" alt="Imagen del lorito" />
          <h2>Aprendé Inglés, Alemán y Chino gratis y de forma divertida!</h2>
        </article>

        <!-- Formulario -->
        <article class="form-login">
          <form id="form-login" class="campo" novalidate>
            <label for="usuario-email">Usuario o email:</label>
            <input
              id="usuario-email"
              name="usuario-email"
              type="text"
              placeholder="ejemplo@email.com"
              required
            />

            <label for="contrasenia">Contraseña:</label>
            <input
              id="contrasenia"
              name="contrasenia"
              type="password"
              placeholder="Mínimo 8 caracteres"
              required
            />

            <label class="campo-checkbox">
              <input type="checkbox" id="recordarme" name="recordarme" />
              Recordar mi usuario
            </label>

            <p id="mensaje-login" class="mensaje-form" role="alert" hidden></p>

            <button type="submit" class="boton-login">
              <span class="negrita">Iniciar Sesión</span>
            </button>
          </form>
        </article>

        <!-- Olvido de Contrasenia -->
        <article class="olvidado">
          <img
            src="imagenes/poli/Poli1.png"
            alt="Imagen de Poli interrogante"
          />

          <a href="paginas/cuenta/olvidaste_contra(recuperar).html"
            >¿Olvidaste tu contraseña?</a
          >
          <a href="paginas/cuenta/registro.html"
            >¿No tenés cuenta? ¡Registrate acá!</a
          >
        </article>
      </section>
    </main>
  </body>
</html>
