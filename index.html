<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <title> PoliLingo - Iniciar Sesión </title>
    <link rel="stylesheet" href="styles.css">

</head>

<body> 

    <main>

        <header class="contenedor-logo">

            <img class="imagen" src="imagenes/Logo.png" alt="Imagen del logo">

            <h2 class="lema"> Aprendé Inglés, Alemán y Chino gratis y de forma divertida</h2>

        </header>

        <section class="login-box">

            <form class="form-login" action="/procesar-datos" method="POST">

                <label class="campo" for="usuario" > 

                    <span>Usuario / Email:</span>
                    <input type="text" id="usuario" name="username" required>

                </label>

                <label class="campo" for="contraseña" > 

                    <span>Contraseña:</span>
                    <input type="password" id="contraseña" name="password" required>

                </label>

            </form>

            <a class="boton-login" href="Dashboard.html">Iniciar Sesión</a>

        </section>

        <section class="registro">

            <img class="imagen-2" src="imagenes/Poli1.png" alt="Imagen de Poli interrogante">

            <section class="opciones">
        
                <a href="RecuperacionContraseña.html">¿Olvidaste tu contraseña?</a>

                <a href="Registro.html">¿No tienes cuenta? Créala aquí</a>

            </section>

        </section>

    </main>

</body>

</html>
