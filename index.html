<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoliLingo - Iniciar Sesión</title>
    <link rel="stylesheet" href="login-register.css" />
  </head>

  <body>
    <main>
      <!-- Logo y Texto del Inicio -->
      <section class="form-login">
        <article class="logo">
          <img src="imagenes/Logo.png" alt="Imagen del lorito" />
          <h2>Aprendé Inglés, Alemán y Chino gratis y de forma divertida!</h2>
        </article>

        <!-- Formulario -->
        <article class="form-login">
          <form action="dashboard/Dashboard.html" method="GET" class="campo">
            <label for="email">Email:</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="ejemplo@email.com"
              required
            />

            <label for="contrasenia">Contraseña:</label>
            <input
              id="contrasenia"
              name="contrasenia"
              type="password"
              placeholder="Mínimo 8 caracteres"
              required
            />

            <label class="campo-checkbox">
              <input type="checkbox" id="recordarme" name="recordarme" />
              Recordar contraseña
            </label>

            <button type="submit" class="boton-login">
              <span class="negrita">Iniciar Sesión</span>
            </button>
          </form>
        </article>

        <!-- Olvido de Contrasenia -->
        <article class="olvidado">
          <img src="imagenes/Poli1.png" alt="Imagen de Poli interrogante" />

          <a href="login-register/olvidaste_contra.html"
            >Olvidaste tu contraseña?</a
          >
          <a href="login-register/registro.html"
            >No tenés cuenta? Logueate acá!</a
          >
        </article>
      </section>
    </main>
  </body>
</html>
